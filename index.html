<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="wardalinski_budget_app_logo.png">
  <title>W Budget App</title>
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      overflow: hidden; /* Strict lock: prevents dragging the page up to see the cropped zone */
      background: #121212; 
    }
    
    iframe { 
      border: none; 
      width: 100%; 
      /* THE TRICK: Force the iframe to be taller than the viewport, pushing the footer off-screen */
      height: calc(100% + 45px); 
      margin-bottom: -45px; 
      touch-action: manipulation; 
    }
  </style>
</head>
<body>
  <iframe src="https://wardalinski-budgeting.streamlit.app/?embed=true"></iframe>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
